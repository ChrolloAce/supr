name: Revdex
options:
  bundleIdPrefix: com.ernesto
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: "12.0.0"
  SuperwallKit:
    url: https://github.com/superwall/Superwall-iOS.git
    from: "4.0.0"
targets:
  Revdex:
    type: application
    platform: iOS
    dependencies:
      - package: GoogleMobileAds
      - package: SuperwallKit
    sources:
      # The StoreKit config is for the Run action only. Excluded so it is never
      # copied into the shipped bundle.
      - path: Revdex
        excludes:
          - "Products.storekit"
    scheme:
      storeKitConfiguration: Revdex/Products.storekit
    entitlements:
      path: Revdex/Revdex.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    info:
      path: Revdex/Info.plist
      properties:
        CFBundleDisplayName: SUPR
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: SUPR uses the camera so you can capture cars you spot in the wild.
        NSPhotoLibraryAddUsageDescription: SUPR saves your captures to your photo library when you share them.
        NSLocationWhenInUseUsageDescription: SUPR uses your location to tag captures with the city you spotted them in and to rank you on your local board.
        NSUserTrackingUsageDescription: This lets SUPR show ads that are relevant to you. Rewarded ads still work if you say no.
        # The real AdMob app id for SUPR.
        GADApplicationIdentifier: ca-app-pub-2491905367957709~7344755048
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
