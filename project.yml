    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jiren.supr.app
        # iPhone only. 1 = iPhone, 2 = iPad; naming both would oblige iPad
        # screenshots and an iPad-correct layout at review.
        TARGETED_DEVICE_FAMILY: "1"
        # Sign in with Apple is a restricted entitlement: it is stripped at
        # signing unless a provisioning profile grants it, so the team has to
        # live here. This file is the source of truth: xcodegen rewrites the
        # xcodeproj, so anything set in Xcode's UI is lost on the next generate.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 5L2794TA8F
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
